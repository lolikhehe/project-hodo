# hodo design tokens — single source of truth for the browser UI (decision A, §K.1).
# Generated into crates/hodo-ui/src/tokens.rs and tokens.css by xtask-design.
# Colors are the verified Material 3 baseline pairs (m3.material.io baseline table).

version = 1
seed = "#6750A4"

# The inverse-* roles below are the ones most often mis-transcribed; the last two
# are explicitly flagged as verified against the published baseline table.
[verification]
verified_against = "m3.material.io baseline table"
flagged_roles = ["inverse_on_surface", "inverse_primary"]

[color.light]
primary = "#6750A4"
on_primary = "#FFFFFF"
primary_container = "#EADDFF"
on_primary_container = "#4F378B"
secondary = "#625B71"
on_secondary = "#FFFFFF"
secondary_container = "#E8DEF8"
on_secondary_container = "#4A4458"
tertiary = "#7D5260"
on_tertiary = "#FFFFFF"
tertiary_container = "#FFD8E4"
on_tertiary_container = "#633B48"
error = "#B3261E"
on_error = "#FFFFFF"
error_container = "#F9DEDC"
on_error_container = "#8C1D18"
surface = "#FEF7FF"
on_surface = "#1D1B20"
on_surface_variant = "#49454F"
surface_container_lowest = "#FFFFFF"
surface_container_low = "#F7F2FA"
surface_container = "#F3EDF7"
surface_container_high = "#ECE6F0"
surface_container_highest = "#E6E0E9"
outline = "#79747E"
outline_variant = "#CAC4D0"
inverse_surface = "#322F35"
inverse_on_surface = "#F5EFF7"
inverse_primary = "#D0BCFF"

[color.dark]
primary = "#D0BCFF"
on_primary = "#381E72"
primary_container = "#4F378B"
on_primary_container = "#EADDFF"
secondary = "#CCC2DC"
on_secondary = "#332D41"
secondary_container = "#4A4458"
on_secondary_container = "#E8DEF8"
tertiary = "#EFB8C8"
on_tertiary = "#492532"
tertiary_container = "#633B48"
on_tertiary_container = "#FFD8E4"
error = "#F2B8B5"
on_error = "#601410"
error_container = "#8C1D18"
on_error_container = "#F9DEDC"
surface = "#141218"
on_surface = "#E6E0E9"
on_surface_variant = "#CAC4D0"
surface_container_lowest = "#0F0D13"
surface_container_low = "#1D1B20"
surface_container = "#211F26"
surface_container_high = "#2B2930"
surface_container_highest = "#36343B"
outline = "#938F99"
outline_variant = "#49454F"
inverse_surface = "#E6E0E9"
inverse_on_surface = "#322F35"
inverse_primary = "#6750A4"

[color.scrim]
color = "#000000"
alpha = 0.32

# M9 type roles: (M3 style, size px, weight, line-height px).
[type.toolbar]
style = "label-large"
size = 14
weight = 500
line_height = 20

[type.url]
style = "body-large"
size = 16
weight = 400
line_height = 24

[type.tabs]
style = "label-medium"
size = 12
weight = 500
line_height = 16

[type.strip]
style = "label-small"
size = 11
weight = 500
line_height = 16

[type.error]
style = "title-large"
size = 22
weight = 700
line_height = 28

[type.about]
style = "headline-small"
size = 24
weight = 400
line_height = 32

[shape]
# none / xs / sm / md / lg / xl / xxl / xxxl / xxxxl, then "full" (pill).
corner_steps = [0, 4, 8, 12, 16, 20, 24, 28, 36]
full = -1.0

[state]
hover = 0.08
focus = 0.10
pressed = 0.10
dragged = 0.16

# M3 Expressive switch geometry (dp). Track/thumb are painted centered in the
# touch target; corners use shape.full. Motion uses spring::EXPRESSIVE_SPATIAL.
[switch]
touch_target = 44
track_width = 52
track_height = 32
thumb = 28

[motion.eased.switch]
duration_ms = 150
easing = [0.31, 0.94, 0.34, 1.00]

[motion.eased.popup_open]
duration_ms = 150
easing = [0.31, 0.94, 0.34, 1.00]

[motion.eased.hover]
duration_ms = 100
easing = [0.31, 0.94, 0.34, 1.00]

[motion.eased.press]
duration_ms = 50
easing = [0.31, 0.94, 0.34, 1.00]

# Five M3 adaptive window classes (width in dp). large/xl reuse expanded layout.
[[window.class]]
name = "compact"
min_dp = 0
max_dp = 599
url_max = 480
popup_width = 320
popup_height = 400

[[window.class]]
name = "medium"
min_dp = 600
max_dp = 839
url_max = 640
popup_width = 360
popup_height = 480

[[window.class]]
name = "expanded"
min_dp = 840
max_dp = 1199
url_max = 720
popup_width = 420
popup_height = 560

[[window.class]]
name = "large"
min_dp = 1200
max_dp = 1599
url_max = 720
popup_width = 420
popup_height = 560

[[window.class]]
name = "xl"
min_dp = 1600
max_dp = -1
url_max = 720
popup_width = 420
popup_height = 560
