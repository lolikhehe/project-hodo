[package]
name = "hodo-js"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["js"]
js = ["dep:boa_engine", "dep:hodo-dom", "dep:hodo-css", "dep:hodo-html"]

[dependencies]
boa_engine = { version = "0.22", optional = true, default-features = false }
hodo-css = { workspace = true, optional = true }
hodo-dom = { workspace = true, optional = true }
hodo-html = { workspace = true, optional = true }
hodo-ext-api.workspace = true
hodo-types.workspace = true
serde_json.workspace = true

[lints]
workspace = true
