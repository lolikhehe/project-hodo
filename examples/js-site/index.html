<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JS site</title>
  <style>
    body { font-family: sans-serif; }
    h1 { font-size: 24px; }
    #out { color: #102080; font-size: 26px; }
    #count { font-size: 20px; }
    #btn { border: 1px solid #444; padding: 6px; }
  </style>
</head>
<body>
  <h1>Page JS fixture</h1>
  <div id="out">JS-PENDING</div>
  <div id="count">count: 0</div>
  <button id="btn" name="btn" type="button">Click me</button>
  <script>
    // Runs before style/layout: the first paint already shows "JS-OK".
    document.getElementById('out').textContent = 'JS-OK';
    var clicks = 0;
    document.getElementById('btn').addEventListener('click', function () {
      clicks = clicks + 1;
      document.getElementById('count').textContent = 'count: ' + clicks;
    });
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('out').textContent = 'JS-OK';
    });
    document.addEventListener('keydown', function (e) {
      document.getElementById('count').textContent = 'key:' + e.key;
    });
  </script>
</body>
</html>
